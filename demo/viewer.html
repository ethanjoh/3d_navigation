<!-- Three.js를 사용하여 GLB 3D 모델을 로드하고 렌더링하는 뷰어 페이지 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer - Three.js</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Three.js ES Modules Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader-container">
            <div id="loader-text" class="loader-text pulse">모델 데이터를 불러오는 중...</div>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="progress-percentage" class="progress-percentage">0%</div>
            <div id="error-message" class="error-message"></div>
        </div>
    </div>

    <!-- Main Viewer Layout -->
    <div class="viewer-container">
        <!-- 3D Canvas -->
        <div id="canvas-container">
            <canvas id="three-canvas"></canvas>
        </div>

        <!-- HTML UI Overlay -->
        <div class="overlay-ui">
            <!-- Top Bar -->
            <div class="top-bar">
                <a href="index.html" class="btn-back">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    대시보드로 돌아가기
                </a>
                
                <!-- Model Info Panel -->
                <div class="model-info-panel">
                    <h2 id="info-title" class="model-title">3D Model</h2>
                    <p id="info-desc" class="model-desc">모델 정보를 불러오는 중입니다.</p>
                </div>
            </div>

            <!-- Bottom Bar -->
            <div class="bottom-bar">
                <!-- Controls Guide -->
                <div class="controls-guide">
                    <p>🖱️ <strong>좌클릭 드래그</strong> : 카메라 회전 (Rotate)</p>
                    <p>🖱️ <strong>우클릭 드래그</strong> : 화면 이동 (Pan)</p>
                    <p>🎡 <strong>마우스 휠 Scroll</strong> : 확대 및 축소 (Zoom)</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js Viewer Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. Model Metadata Configuration
        const modelsConfig = {
            agv: {
                title: "AGV (Automated Guided Vehicle)",
                desc: "agv-exam 폴더의 agv.glb 파일입니다. 마우스로 AGV 3D 차량을 클릭하면 3D 트랙 궤도를 따라 자율 주행을 시작하거나 정지시킬 수 있습니다.",
                path: "agv-exam/agv.glb"
            },
            ballboy: {
                title: "Ball Boy",
                desc: "ballboy-exam 폴더의 ballboy.glb 파일입니다. 로봇 캐릭터 형태의 메쉬와 구성 요소 곡면 구성을 다각도에서 탐색할 수 있습니다.",
                path: "ballboy-exam/ballboy.glb"
            },
            drill: {
                title: "Drill Machine",
                desc: "drill-exam 폴더의 drill.glb 파일입니다. 금속 재질의 반사와 세부 드릴 파트 결합 구조를 확인할 수 있습니다.",
                path: "drill-exam/drill.glb"
            },
            lab: {
                title: "Laboratory Space",
                desc: "lab-exam 폴더의 lab.glb 파일입니다. 연구실 내부 시설 및 3D 입체 공간 레이아웃 전체를 가상 환경으로 시각화합니다.",
                path: "lab-exam/lab.glb"
            },
            myroom: {
                title: "My Room",
                desc: "myroom-exam 폴더의 myroom.glb 파일입니다. 가구 조형과 방 내부 공간 배치를 보여주는 3D 모델입니다.",
                path: "myroom-exam/myroom.glb"
            },
            nc: {
                title: "NC Machine",
                desc: "nc_exam 폴더의 nc.glb 파일입니다. 수치제어 정밀 공작기계의 전체 형상과 베이스 프레임을 시각화합니다.",
                path: "nc_exam/nc.glb"
            },
            robot: {
                title: "Robot Pendant",
                desc: "robot_exam 폴더의 robot.glb 파일입니다. 산업 현장에서 흔히 사용되는 휴대형 컨트롤 Pendant 기기 조작 쉘 3D 형상입니다.",
                path: "robot_exam/robot.glb"
            }
        };

        // Parse query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const modelKey = urlParams.get('model');
        const modelData = modelsConfig[modelKey];

        const loaderText = document.getElementById('loader-text');
        const progressBar = document.getElementById('progress-bar');
        const progressPercentage = document.getElementById('progress-percentage');
        const errorMessage = document.getElementById('error-message');
        const loadingScreen = document.getElementById('loading-screen');

        if (!modelData) {
            // Invalid model parameter
            loaderText.style.display = 'none';
            progressBar.parentElement.style.display = 'none';
            progressPercentage.style.display = 'none';
            errorMessage.textContent = '올바르지 않은 모델 접근입니다. 대시보드로 다시 이동해 주세요.';
            errorMessage.style.display = 'block';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3000);
        } else {
            // Update UI Information Panels
            document.getElementById('info-title').textContent = modelData.title;
            document.getElementById('info-desc').textContent = modelData.desc;
            document.title = `${modelData.title} - 3D Viewer`;

            // AGV Click Hint UI
            if (modelKey === 'agv') {
                const guideContainer = document.querySelector('.controls-guide');
                if (guideContainer) {
                    const clickHint = document.createElement('p');
                    clickHint.style.color = '#60a5fa';
                    clickHint.style.fontWeight = '600';
                    clickHint.innerHTML = '🚗 <strong>AGV 차량 클릭</strong> : 궤도 자율 주행 시작/정지 토글';
                    guideContainer.prepend(clickHint);
                }
            }

            // Start initializing Three.js application
            initThreeApp(modelData.path);
        }

        function initThreeApp(modelPath) {
            const canvas = document.getElementById('three-canvas');
            
            // 2. Scene setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#e0e0e0');
            scene.fog = new THREE.FogExp2('#e0e0e0', 0.005);

            // 3. Camera setup
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            // 4. Renderer setup
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace; // Correct property for Three.js >= r152
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;

            // 5. Controls setup
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1; // Limit panning below ground slightly
            controls.minDistance = 0.5;
            controls.maxDistance = 100;

            // 6. Lighting setup (Universal balanced lighting)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(10, 20, 5); // Angled top light to reveal surface details
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 50;
            mainLight.shadow.bias = -0.0001;
            scene.add(mainLight);

            // 7. Grid & Ground Helper
            const gridHelper = new THREE.GridHelper(60, 60, 0x8b5cf6, 0x1f2937);
            gridHelper.position.y = -0.01;
            gridHelper.material.opacity = 0.2;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            // AGV Special Variables
            let loadedModel = null;
            let agvVehicleGroup = null;
            let agvCurve = null;
            let agvPathLine = null;
            let isDriving = false;
            let progress = 0;

            // 8. GLTF/GLB Loader
            const loader = new GLTFLoader();
            loader.load(
                modelPath,
                // On Load Success
                function (gltf) {
                    const model = gltf.scene;
                    loadedModel = model;
                    
                    // Enable shadows and apply material fixes for all meshes
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            
                            if (node.material) {
                                node.material.depthWrite = true;
                                
                                // Force unlit materials to Standard so they react to lights correctly
                                if (!node.material.isMeshStandardMaterial) {
                                    const newMat = new THREE.MeshStandardMaterial({
                                        color: node.material.color || new THREE.Color(0xffffff),
                                        map: node.material.map || null,
                                        roughness: 0.8,
                                        metalness: 0.1
                                    });
                                    node.material = newMat;
                                } else {
                                    node.material.roughness = 0.8; // Prevent blinding reflections
                                    node.material.metalness = 0.1; 
                                }
                                
                                // Disable glowing emissive values which blow out textures
                                if (node.material.emissive) {
                                    node.material.emissive.setHex(0x000000);
                                }
                                
                                node.material.needsUpdate = true;
                            }
                        }
                    });

                    scene.add(model);

                    // Auto-adjust camera focus based on model bounding box
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    // Center model geometry offset
                    model.position.x += (model.position.x - center.x);
                    model.position.y += (model.position.y - box.min.y); // Place model bottom on ground
                    model.position.z += (model.position.z - center.z);

                    // Re-calculate bounding box since position changed
                    const adjustedBox = new THREE.Box3().setFromObject(model);
                    const adjustedCenter = adjustedBox.getCenter(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    
                    // Setup AGV Track Curve & Isolate Vehicle Meshes
                    if (modelKey === 'agv') {
                        agvVehicleGroup = new THREE.Group();
                        scene.add(agvVehicleGroup);

                        // Find meshes belonging to AGV Vehicle (exclude background boxes)
                        const meshesToMove = [];
                        model.traverse((node) => {
                            if (node.isMesh) {
                                if (!node.name.includes('Shape_Box') && !node.name.toLowerCase().includes('box')) {
                                    meshesToMove.push(node);
                                }
                            }
                        });

                        // Re-parent vehicle meshes into agvVehicleGroup
                        meshesToMove.forEach((mesh) => {
                            agvVehicleGroup.add(mesh);
                        });

                        // Align AGV Vehicle bottom to Y=0 ground plane
                        const vehicleBox = new THREE.Box3().setFromObject(agvVehicleGroup);
                        const minY = vehicleBox.min.y;
                        agvVehicleGroup.children.forEach((child) => {
                            child.position.y -= minY;
                        });

                        // Re-calculate Vehicle Size after Y zero-ground adjustment
                        const adjustedVehicleBox = new THREE.Box3().setFromObject(agvVehicleGroup);
                        const vehicleSize = adjustedVehicleBox.getSize(new THREE.Vector3());

                        const rw = Math.max(vehicleSize.x * 2.8, 6);
                        const rd = Math.max(vehicleSize.z * 2.8, 5);
                        
                        const trackWaypoints = [
                            new THREE.Vector3(-rw / 2, 0, -rd / 2),
                            new THREE.Vector3(rw / 2, 0, -rd / 2),
                            new THREE.Vector3(rw / 2, 0, rd / 2),
                            new THREE.Vector3(-rw / 2, 0, rd / 2)
                        ];
                        agvCurve = new THREE.CatmullRomCurve3(trackWaypoints, true, 'centripetal', 0.2);
                        
                        // Visual Path Line
                        const pathPoints = agvCurve.getPoints(120);
                        const pathGeo = new THREE.BufferGeometry().setFromPoints(pathPoints);
                        const pathMat = new THREE.LineBasicMaterial({
                            color: 0x60a5fa,
                            transparent: true,
                            opacity: 0.7,
                            linewidth: 2
                        });
                        agvPathLine = new THREE.LineLoop(pathGeo, pathMat);
                        agvPathLine.position.y = 0.02; // Slightly above ground
                        scene.add(agvPathLine);
                    }

                    // Calculate optimal camera distance
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                    cameraZ *= 1.4; // Multiplier to add some padding

                    camera.position.set(cameraZ, maxDim * 0.8, cameraZ);
                    camera.lookAt(adjustedCenter);
                    
                    controls.target.copy(adjustedCenter);
                    controls.update();

                    // Fade out loading screen
                    setTimeout(() => {
                        loadingScreen.style.opacity = 0;
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                        }, 500);
                    }, 200);
                },
                // On Progress
                function (xhr) {
                    if (xhr.total > 0) {
                        const percent = Math.round((xhr.loaded / xhr.total) * 100);
                        progressBar.style.width = percent + '%';
                        progressPercentage.textContent = percent + '%';
                        
                        if (percent >= 100) {
                            loaderText.textContent = '장면을 생성하는 중...';
                        }
                    } else {
                        // Fallback when Content-Length header is missing
                        const loadedKB = Math.round(xhr.loaded / 1024);
                        loaderText.textContent = `데이터를 다운로드하는 중 (${loadedKB} KB)...`;
                        progressBar.style.width = '70%'; // Simulating progress
                        progressPercentage.textContent = '--%';
                    }
                },
                // On Error
                function (error) {
                    console.error('An error happened while loading GLB model:', error);
                    loaderText.style.display = 'none';
                    progressBar.parentElement.style.display = 'none';
                    progressPercentage.style.display = 'none';
                    errorMessage.textContent = '3D 모델 파일을 로딩하는 데 실패했습니다. 파일 경로 및 브라우저 CORS 설정을 확인해 주세요.';
                    errorMessage.style.display = 'block';
                }
            );

            // Raycaster Interaction Setup
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let pointerDownTime = 0;
            let pointerDownPos = { x: 0, y: 0 };

            const getRaycastTarget = () => (modelKey === 'agv' && agvVehicleGroup ? agvVehicleGroup : loadedModel);

            window.addEventListener('pointerdown', (e) => {
                pointerDownTime = Date.now();
                pointerDownPos = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointerup', (e) => {
                const moveDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                const pressTime = Date.now() - pointerDownTime;
                const targetObj = getRaycastTarget();
                
                // Only trigger if it was a quick click without dragging camera
                if (moveDist < 6 && pressTime < 300 && targetObj && modelKey === 'agv') {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObject(targetObj, true);
                    
                    if (intersects.length > 0) {
                        isDriving = !isDriving;
                    }
                }
            });

            window.addEventListener('pointermove', (e) => {
                const targetObj = getRaycastTarget();
                if (targetObj && modelKey === 'agv') {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObject(targetObj, true);
                    canvas.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
                }
            });

            // 9. Resize Handling
            window.addEventListener('resize', onWindowResize);

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            // 10. Animation Loop
            function animate() {
                requestAnimationFrame(animate);
                
                // AGV Driving Update
                if (modelKey === 'agv' && isDriving && agvCurve && agvVehicleGroup) {
                    progress = (progress + 0.0012) % 1;
                    const currentPos = agvCurve.getPointAt(progress);
                    const nextPos = agvCurve.getPointAt((progress + 0.003) % 1);
                    
                    agvVehicleGroup.position.x = currentPos.x;
                    agvVehicleGroup.position.y = 0;
                    agvVehicleGroup.position.z = currentPos.z;
                    
                    const lookTarget = new THREE.Vector3(nextPos.x, agvVehicleGroup.position.y, nextPos.z);
                    agvVehicleGroup.lookAt(lookTarget);
                }

                // Update controls
                controls.update();
                
                // Render Scene
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
